name: 每日掃描突破年線

on:
  schedule:
    # 分 時 日 月 週 (UTC 時間 09:00 = 台北時間 17:00)
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # 允許手動測試

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    permissions:      # 加入這部分
      contents: write # 顯式要求寫入權限
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Analysis Script
        env:
          LINE_ACCESS_TOKEN: ${{ vars.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ vars.LINE_USER_ID }}
          STOCK_FILES: ${{ vars.STOCK_FILES }}
          FINMIND_ACCESS_TOKEN: ${{ vars.FINMIND_ACCESS_TOKEN }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ vars.RECIPIENT_EMAIL }}
          EMAIL_APP_PASSWORD: ${{ vars.EMAIL_APP_PASSWORD }}
        run: python scan_ma240.py        

      - name: Commit and Push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Daily 240MA scan results update" || echo "No changes to commit"
          git push

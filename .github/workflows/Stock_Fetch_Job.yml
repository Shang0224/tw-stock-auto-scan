name: 取得台灣50與中型100歷史資料

on:
  workflow_dispatch: # 允許手動點擊按鈕執行 (適合你這次的一次性大工程)
  #schedule:
   # - cron: '0 10 * * 1-5' # (選配) 每週一至五，台北時間下午 6 點自動執行

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 允許程式將 CSV push 回儲存庫

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Stock Fetcher
      env:
        # 如果你有 FinMind Token，請在 Repo Settings > Secrets 設定
        STOCK_FILES: ${{ vars.STOCK_FILES }}
        STOCK_FILES_TEST: ${{ vars.STOCK_FILES_TEST }}
        FINMIND_ACCESS_TOKEN: ${{ vars.FINMIND_ACCESS_TOKEN }}
        SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
        RECIPIENT_EMAIL: ${{ vars.RECIPIENT_EMAIL }}
        EMAIL_APP_PASSWORD: ${{ vars.EMAIL_APP_PASSWORD }}
        NAS_PASSWORD: ${{ secrets.NAS_PASSWORD }}
        NAS_SFTP_PATH: '${{ secrets.NAS_SFTP_PATH }}'
        NAS_SFTP_PORT: ${{ secrets.NAS_SFTP_PORT }}     
        NAS_VPN_IP: ${{ secrets.NAS_VPN_IP }}
        NAS_ACCOUNT: ${{ secrets.NAS_ACCOUNT }}
      run: |
        python fetch_stock_data.py

    - name: Upload Data Artifact
      uses: actions/upload-artifact@v4
      with:
        name: stock-csv-data
        path: data/*.csv
        retention-days: 5 # 下載連結保留 5 天

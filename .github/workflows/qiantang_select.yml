name: 錢塘潮七合一自動選股排程

on:
  # 1. 自動排程：台股盤後籌碼約在 15:30~16:00 全數更新完畢
  # 設定在每週一至週五的台北時間 16:30 (國際標準時 UTC 08:30) 自動執行
  #schedule:
     #- cron: '30 8 * * 1-5'
  
  # 2. 手動觸發：允許您隨時在 GitHub Actions 網頁畫面上點擊「Run workflow」立即執行
  workflow_dispatch:

jobs:
  stock_screening:
    runs-on: ubuntu-latest

    steps:
    # 步驟一：切換並檢出您的程式碼
    - name: Checkout repository
      uses: actions/checkout@v4

    # 步驟二：設定 Python 環境 (使用穩定的 3.10 版本)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # 開啟快取功能，加速下一次執行

    # 步驟三：安裝 Python 必備套件
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 步驟四：執行選股核心主程式
    # 備註：請確保您的 Python 檔名叫 qiantang_7in1.py，若不同請在下方修改
    - name: Run Qiantang 7-in-1 system
      run: |
        python qiantang_7in1.py

    # 步驟五：自動將產出的 Excel 選股報告 Commit 並 Push 回您的 GitHub 儲存庫
    - name: Commit and Push Report
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        
        # 檢查是否有新產生的 Excel 檔案，有的話就加入暫存區
        if ls 錢塘潮選股報告_*.xlsx 1> /dev/null 2>&1; then
          git add 錢塘潮選股報告_*.xlsx
          git commit -m "🤖 自動更新：錢塘潮選股報告 ($(date +'%Y-%m-%d'))"
          git push
        else
          echo "找不到產出的 Excel 報告，跳過 Commit 步驟。"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

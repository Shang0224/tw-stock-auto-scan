name: 每季掃描台灣50與中型100清單

on:
  schedule:
    # 分 時 日 月 週 (UTC 時間 02:00 = 台北時間 10:00)
    - cron: '0 2 10 3,6,9,12 *'
  workflow_dispatch: # 允許手動點擊按鈕執行，方便測試

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Fetch Script
        run: python fetch_list.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Automated quarterly update of stock list" || echo "No changes to commit"
          git push
